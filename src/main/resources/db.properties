# ========================================================
# Configurações de Conexão com o Banco de Dados - Littera
# ========================================================

# Tipo do banco de dados: "sqlite" ou "mysql"
db.type=sqlite

# Configurações para SQLite (banco embutido sem necessidade de instalação de servidor)
sqlite.url=jdbc:sqlite:littera.db

# Configurações para MySQL (caso deseje utilizar servidor MySQL)
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://localhost:3306/littera_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
mysql.user=root
mysql.password=root
